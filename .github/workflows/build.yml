name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6

      - name: Build
        working-directory: fabric-mod-builder
        run: gradle build --no-daemon --stacktrace

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fabric-mod
          path: fabric-mod-builder/build/libs/*.jar
