
name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.6

      - name: Find Gradle Project
        id: find-project
        shell: bash
        run: |
          echo "Searching for Gradle project..."

          BUILD_FILE=$(find . -maxdepth 5 -type f \
            \( -name "settings.gradle" \
            -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            BUILD_FILE=$(find . -maxdepth 5 -type f \
              \( -name "build.gradle" \
              -o -name "build.gradle.kts" \) \
              | head -n 1)
          fi

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: No Gradle project found!"
            find . -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Gradle project found: $PROJECT_DIR"

      - name: Build Mod
        working-directory: ${{ steps.find-project.outputs.project_dir }}
        run: gradle build --no-daemon --stacktrace

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: fabric-mod
          path: ${{ steps.find-project.outputs.project_dir }}/build/libs/*.jar
          if-no-files-found: error
